<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Will you be my Valentine Chikku 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background:
    linear-gradient(rgba(255,182,193,0.3), rgba(255,182,193,0.55)),
    url("https://raw.githubusercontent.com/abhinovreddy1289/vday/main/0W0A0201.jpg");
  background-size: cover;
  background-position: top;

  font-family: Tahoma, Verdana, Segoe UI, sans-serif;
  text-align: center;
  color: #fff;
  overflow: hidden;
  touch-action: manipulation;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* 💎 Glass card */
.card {
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);

  color: #333;
  padding: 32px;
  border-radius: 26px;
  max-width: 520px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.35);
}

.card h1 { font-size: 34px; margin-bottom: 12px; }
.card p  { font-size: 20px; margin-bottom: 22px; }

button {
  font-size: 24px;
  margin: 12px;
  padding: 16px 34px;
  border-radius: 32px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: transform 0.15s ease;
}
button:hover { transform: scale(1.1); }

#yes { background: #ff6f91; color: white; }

/* NO starts normal */
#no {
  background: #ffd3e0;
  color: #900;
  position: relative;
}

/* NO when dodging */
#no.runaway {
  position: fixed;
  z-index: 9999;
}

/* Floating hearts */
@keyframes floatHearts {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-520px); opacity: 0; }
}
.heart {
  position: absolute;
  font-size: 30px;
  animation: floatHearts 4s ease-out forwards;
  pointer-events: none;
}

/* Emoji burst */
@keyframes burst {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0.7); opacity: 0; }
}
.particle {
  position: fixed;
  font-size: 28px;
  pointer-events: none;
  animation: burst 700ms ease-out forwards;
}
</style>
</head>

<body onclick="handleTap(event)" ontouchstart="handleTap(event)">

<div class="card">
  <h1>💖 Will you be my Valentine Chikku! 💖</h1>
  <p>(I dare you to click NO 😜)</p>

  <button id="yes" onclick="yesClicked()">YES 💕</button>
  <button id="no"
    onmouseover="moveNo()"
    ontouchstart="moveNo()"
    onclick="moveNo()">NO 😝</button>
</div>

<audio id="bgMusic" loop preload="auto" playsinline>
  <source src="https://raw.githubusercontent.com/abhinovreddy1289/music/main/dialouge.mp3" type="audio/mpeg">
</audio>

<script>
let musicStarted = false;

/* Music */
function startMusic(){
  if (musicStarted) return;
  musicStarted = true;
  document.getElementById("bgMusic").play().catch(()=>{});
}

/* ✅ BULLETPROOF NO MOVE (never off-screen on mobile) */
function moveNo(){
  const no = document.getElementById("no");
  no.classList.add("runaway");

  // viewport info (best for iOS Safari too)
  const vv = window.visualViewport;
  const vw = vv ? vv.width : window.innerWidth;
  const vh = vv ? vv.height : window.innerHeight;
  const ox = vv ? vv.offsetLeft : 0;
  const oy = vv ? vv.offsetTop  : 0;

  // real button size
  const rect = no.getBoundingClientRect();
  const bw = rect.width  || 160;
  const bh = rect.height || 70;

  const pad = 12;

  // usable range inside viewport
  const rangeX = Math.max(0, vw - bw - (pad * 2));
  const rangeY = Math.max(0, vh - bh - (pad * 2));

  // final position (clamped)
  const x = ox + pad + (Math.random() * rangeX);
  const y = oy + pad + (Math.random() * rangeY);

  no.style.left = `${x}px`;
  no.style.top  = `${y}px`;
}

/* Hearts */
function createHearts(n){
  for(let i=0;i<n;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.textContent=["💗","💖","💕","💘","❤️"][Math.floor(Math.random()*5)];
    h.style.left=Math.random()*window.innerWidth+"px";
    h.style.top=window.innerHeight+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4500);
  }
}

/* Emoji burst */
function emojiBurst(x,y){
  const emojis=["💖","💕","✨","😍","😘","💘","🥰"];
  for(let i=0;i<14;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left=x+"px";
    p.style.top=y+"px";
    p.style.setProperty("--dx",(Math.random()*220-110)+"px");
    p.style.setProperty("--dy",(Math.random()*220-140)+"px");
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),900);
  }
}

/* Tap handler */
function handleTap(e){
  startMusic();
  let x, y;
  if (e.touches && e.touches.length) {
    x = e.touches[0].clientX;
    y = e.touches[0].clientY;
  } else {
    x = e.clientX || innerWidth/2;
    y = e.clientY || innerHeight/2;
  }
  emojiBurst(x,y);
}

/* YES click */
function yesClicked(){
  createHearts(30);

  document.body.innerHTML=`
  <div style="
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
      linear-gradient(rgba(255,182,193,0.7), rgba(255,182,193,0.7)),
      url('https://raw.githubusercontent.com/abhinovreddy1289/vday/main/0W0A0201.jpg');
    background-size:cover;
    color:white;
    text-align:center;
    font-family:Tahoma,Verdana,Segoe UI,sans-serif;
    padding:20px;
  " onclick="handleTap(event)" ontouchstart="handleTap(event)">
    <h1 id="typing" style="font-size:42px;"></h1>
    <div id="final" style="display:none;">
      <h1 style="font-size:48px;">💖 You chose wisely! 💖</h1>
      <p style="font-size:26px;max-width:720px;line-height:1.45;">
        You just signed up for lifetime of happiness 🥰<br>
        No take-backs.<br>
        No refunds.<br>
        No escape 😜<br><br>
        Happy Valentine’s Day 💕
      </p>
      <button onclick="location.reload()"
        style="font-size:22px;padding:14px 26px;border-radius:30px;border:none;background:#ff6f91;color:white;">
        🔁 Back to YES
      </button>
    </div>
  </div>
  <audio id="bgMusic" loop autoplay playsinline>
    <source src="https://raw.githubusercontent.com/abhinovreddy1289/music/main/dialouge.mp3" type="audio/mpeg">
  </audio>
  `;
  startTyping();
}

/* Typing */
function startTyping(){
  const text="Loading relationship… 99%";
  const el=document.getElementById("typing");
  let i=0;
  const t=setInterval(()=>{
    el.textContent+=text[i++];
    if(i===text.length){
      clearInterval(t);
      setTimeout(()=>{
        el.style.display="none";
        document.getElementById("final").style.display="block";
        createHearts(40);
      },800);
    }
  },90);
}
</script>

</body>
</html>
